name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - '**/.gitignore'
      - 'assets/**/*'
      - 'texts/weblate_files/en/*'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - '**/.gitignore'
      - 'images/**/*'
      - 'texts/weblate_files/en/*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit Information
        id: commit
        run: |
          echo "commit_message=$(git log -1 --pretty=%s)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: Qi-Busiyi-Hanhuazu/ChokuretsuTranslationUtility
          ref: master
          path: tools
      - name: Get tools commit id
        id: get-tools-commit-id
        run: |
          Push-Location tools/
          Write-Output "id=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          Pop-Location
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: echo "${{ secrets.ORIGINAL_FILES_URL }}" > original_files_url.txt
      - name: Cache original files
        id: cache-original-files
        uses: actions/cache@v4
        with:
          path: original_files/
          key: original-files-${{ hashFiles('original_files_url.txt') }}
      - name: Cache tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: tools/HaruhiChokuretsuCLI/bin/Release/
          key: tools-${{ steps.get-tools-commit-id.outputs.id }}
      - name: Build patch
        env:
          ORIGINAL_FILES_URL: "${{ secrets.ORIGINAL_FILES_URL }}"
          PYTHONUTF8: 1
        run: |
          Try
          {
            if (dotnet-script -h) {}
          }
          Catch
          {
            dotnet tool install -g dotnet-script
          }
          ./build.ps1
      - name: Upload patch
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
        uses: actions/upload-artifact@v4
        with:
          name: patch
          path: |
            out/patch/*
      - name: GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "out/patch.xzp"
          name: "${{ steps.commit.outputs.commit_message }}"
          body: |
            本页面下方的链接为自动构建并发布的开发版本补丁。**此版本补丁可能存在较多问题，仅供测试使用。**

            [原始 ROM](https://datomatic.no-intro.org/index.php?page=show_record&s=28&n=3810) 的 md5 校验码为：`6536132efddd337aa5069e627591fee5`。

            请访问 [此处](https://github.com/Xzonn/NitroPatcher/releases/latest/) 获取补丁应用工具。
          prerelease: true
          tag: publish
          token: ${{ secrets.GITHUB_TOKEN }}
